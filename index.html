        function startTouchTest() {
            const overlay = document.getElementById('touch-overlay');
            overlay.classList.remove('hidden');
            const canvas = document.getElementById('touchCanvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 60;
            const ctx = canvas.getContext('2d');
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 15;
            ctx.lineCap = 'round';

            let drawing = false;
            canvas.onpointerdown = (e) => { drawing = true; ctx.beginPath(); ctx.moveTo(e.clientX, e.clientY); };
            canvas.onpointermove = (e) => { if (!drawing) return; ctx.lineTo(e.clientX, e.clientY); ctx.stroke(); };
            canvas.onpointerup = () => { drawing = false; };
        }

        function finishTouchTest() {
            document.getElementById('touch-overlay').classList.add('hidden');
            results['touch'] = true;
            currentStep++;
            if (currentStep < testSteps.length) runStep();
            else showSummary();
        }

        // --- 3. Camera Test Logic ---
        async function startCameraTest() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                document.getElementById('cameraPreview').srcObject = stream;
            } catch (err) {
                alert('ကင်မရာ ဖွင့်၍မရပါ: ' + err);
            }
        }

        // --- 4. Mic Test Logic ---
        async function startMicTest() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                const status = document.getElementById('micStatus');
                status.innerText = "🎤 အသံဖမ်းယူနေပါပြီ... စကားပြောကြည့်ပါ";
                status.className = "text-lg font-semibold text-green-400 mb-4";

            }
        }

        function recordResult(passed) {

                runStep();
            } else {
